name: Gerar aplicativo Windows

on:
  workflow_dispatch:

jobs:
  gerar-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compilar aplicativo
        run: pyinstaller --noconfirm --clean SistemaCobranca_Windows.spec

      - name: Validar arquivos gerados
        shell: pwsh
        run: |
          $executavel = "dist/SistemaCobranca.exe"
          $marcador = "MODO_PORTATIL.txt"

          if (-not (Test-Path $executavel)) {
            throw "Executável não encontrado: $executavel"
          }

          if ((Get-Item $executavel).Length -lt 10MB) {
            throw "Executável incompleto: a DLL do Python pode não ter sido incorporada."
          }

          if (-not (Test-Path $marcador)) {
            throw "Marcador do modo portátil não encontrado: $marcador"
          }

      - name: Compactar aplicativo portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Entrega_Carla" | Out-Null
          Copy-Item "dist/SistemaCobranca.exe" "Entrega_Carla/SistemaCobranca.exe"
          Copy-Item "MODO_PORTATIL.txt" "Entrega_Carla/MODO_PORTATIL.txt"
          Compress-Archive `
            -Path "Entrega_Carla" `
            -DestinationPath "SistemaCobranca_Windows_portatil.zip"

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: SistemaCobranca-Windows-portatil
          path: SistemaCobranca_Windows_portatil.zip
          if-no-files-found: error
          retention-days: 30
