name: Gerar aplicativo Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável Windows
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SistemaCobranca `
            app_desktop.py

      - name: Verificar executável
        run: |
          Get-ChildItem -Path dist

      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: SistemaCobranca-Windows
          path: dist/SistemaCobranca.exe
          if-no-files-found: error
