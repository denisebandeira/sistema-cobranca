name: Gerar aplicativo macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar aplicativo macOS
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name SistemaCobranca \
            app_desktop.py

      - name: Verificar aplicativo
        run: |
          ls -lah dist
          ls -lah dist/SistemaCobranca.app

      - name: Compactar aplicativo
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/SistemaCobranca.app \
            SistemaCobranca-macOS.zip

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: SistemaCobranca-macOS
          path: SistemaCobranca-macOS.zip
          if-no-files-found: error
